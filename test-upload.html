<!DOCTYPE html>
<html>

<head>
    <title>FileThrough Test</title>
</head>

<body>

    <h1>Passport Application</h1>

    <label for="photo">Upload Photograph</label>

    <p>
        Photograph must be PNG.
        File size: 20 KB to 100 KB
        Dimensions: 200 x 230 pixels.
    </p>

    <input id="photo" name="passportPhoto" type="file" accept=".png">

<p id="status">No file selected.</p>

<script>
    const input = document.getElementById('photo');
    const status = document.getElementById('status');

    input.addEventListener('change', () => {
        const file = input.files?.[0];

        if (!file) {
            status.textContent = 'No file selected.';
            return;
        }

        status.textContent =
            `Page sees: ${file.name} | ${file.type} | ${file.size} bytes`;
    });
</script>

</body>

</html>
