<!DOCTYPE html>
<html>

<head>
    <title>FileThrough Dynamic Input Test</title>
</head>

<body>

    <h1>Dynamic Upload Test</h1>

    <div id="upload-area">
        <p>Upload field will appear in 2 seconds...</p>
    </div>

    <script>
        setTimeout(() => {
            const area = document.getElementById('upload-area');

            area.innerHTML = `
                <label for="photo">Upload Photograph</label>

                <p>
                    Photograph must be JPEG.
                    File size: 20 KB to 100 KB
                    Dimensions: 200 x 230 pixels.
                </p>

                <input
                    id="photo"
                    name="passportPhoto"
                    type="file"
                    accept=".jpg,.jpeg"
                >
            `;
        }, 2000);
    </script>

</body>

</html>
